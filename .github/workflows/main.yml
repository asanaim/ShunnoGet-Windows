name: Build Shunno Browser Full Rust Windows EXE

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Release EXE
        run: cargo build --release

      - name: Prepare Release EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-exe | Out-Null
          if (Test-Path "target/release/ShunnoBrowser.exe") {
            Copy-Item "target/release/ShunnoBrowser.exe" "release-exe/ShunnoBrowser.exe" -Force
          } elseif (Test-Path "target/release/ShunnoGet.exe") {
            Copy-Item "target/release/ShunnoGet.exe" "release-exe/ShunnoBrowser.exe" -Force
          } else {
            Get-ChildItem -Path target/release -Filter *.exe
            throw "No compiled .exe found in target/release"
          }

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShunnoBrowser-Full-Rust-Windows-EXE
          path: release-exe/ShunnoBrowser.exe

      - name: Publish 1-Click Direct Download Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Shunno Browser v1.0 for Windows (Full NBPro + Brave Audio + 32-Thread Shunno Get)"
          make_latest: true
          body: |
            ### 🦀 Direct 1-Click Download for Windows 10 & 11 (Native Rust)
            - **[👉 Download ShunnoBrowser.exe](https://github.com/${{ github.repository }}/releases/latest/download/ShunnoBrowser.exe)**
          files: |
            release-exe/ShunnoBrowser.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
