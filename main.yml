name: Build Shunno Get Rust Windows EXE

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Release EXE
        run: cargo build --release

      - name: Prepare Release EXE
        run: |
          mkdir release-exe
          copy target\release\ShunnoGet.exe release-exe\ShunnoGet.exe

      - name: Upload ShunnoGet Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShunnoGet-Rust-Windows-EXE
          path: release-exe/ShunnoGet.exe

      - name: Publish 1-Click Direct Download Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Shunno Get v1.0 (Native Rust Windows EXE)"
          make_latest: true
          body: |
            ### 🦀 Direct 1-Click Download for Windows 10 & 11 (Native Rust)
            Ultra-lightweight (~6 MB), standalone native Rust executable with zero external runtime dependencies and <20 MB RAM usage:
            - **[👉 Download ShunnoGet.exe (Standalone Native Rust EXE)](https://github.com/${{ github.repository }}/releases/latest/download/ShunnoGet.exe)**
          files: |
            release-exe/ShunnoGet.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
